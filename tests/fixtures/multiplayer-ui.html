<!doctype html><html lang="en"><meta charset="utf-8"><title>Multiplayer UI regression fixture</title>
<section id="lobby-panel-scenario"><button id="solo-airport">Airport</button><button id="solo-preset">Preset</button><button id="solo-restricted" disabled>Restricted aircraft</button></section>
<script type="module">
import { MultiplayerController } from '/src/multiplayer/MultiplayerController.js';
import { FlightControls } from '/src/controls/FlightControls.js';
import { GameFlowController } from '/src/ui/GameFlowController.js';
for (const id of ['mp-audio','mp-room','lobby-tab-multiplayer','mp-create','mp-join','mp-start','mp-respawn','mp-leave','mp-copy','mp-microphone','mp-listen','mp-mute','mp-ptt','mp-controls','mp-connect','mp-invite-row','mp-invite','mp-status','mp-roster','mp-voice-status']) {
  const el = document.createElement(id === 'mp-audio' ? 'audio' : id === 'mp-ptt' ? 'button' : 'div'); el.id = id; document.body.append(el);
}
const controls = new FlightControls(document.body);
const gameFlow = new GameFlowController(); gameFlow.enterFlight();
const sim = { gameFlow, showToast() {}, lobbyScreen: { setSelectionBusy() {}, refresh() { document.getElementById('solo-restricted').disabled = true; } } };
const controller = new MultiplayerController(sim);
controller.room = { host: false, closed: false, session: { name: 'Pilot', state: 'flying' } };
controller.voice = { microphone: {}, talking: false, setTalking(on) { this.talking = on; } };
controller.refresh();
window.uiFixture = {
  controller, controls,
  press(key, code) {
    const button = document.getElementById('mp-ptt'); button.focus();
    button.dispatchEvent(new KeyboardEvent('keydown', { key, code, bubbles: true, cancelable: true }));
    return { talking: controller.voice.talking, braking: Boolean(controls.keys.Space) };
  },
  release(key, code) {
    document.getElementById('mp-ptt').dispatchEvent(new KeyboardEvent('keyup', { key, code, bubbles: true, cancelable: true }));
    return { talking: controller.voice.talking, braking: Boolean(controls.keys.Space) };
  }
};
</script></html>
