name: UI Screens

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which screens tier to capture/verify'
        required: false
        default: 'core'
        type: choice
        options:
          - core
          - full
          - all
      publish:
        description: 'Publish: save screenshots, commit to repository, and trigger GitHub Pages deploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: ui-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Capture UI screens
        run: |
          if [ "${{ inputs.publish }}" = "true" ]; then
            node scripts/capture-all-ui-screens.mjs --tier ${{ inputs.tier || 'core' }}
          else
            node scripts/capture-all-ui-screens.mjs --tier ${{ inputs.tier || 'core' }} --verify
          fi
        env:
          FORCE_GPU: '0'

      - name: Commit and push updated UI screens
        if: ${{ inputs.publish }}
        run: |
          if [ -n "$(git status --porcelain public/screenshots/ui)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/screenshots/ui/
            git commit -m "chore(screens): update UI screens showcase [tier: ${{ inputs.tier || 'core' }}]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No screenshot or catalog changes to commit."
          fi

      - name: Trigger GitHub Pages deployment
        if: ${{ inputs.publish && github.ref_name == 'main' }}
        run: |
          curl -s -f -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}' || echo "Notice: Could not dispatch pages.yml via API; scheduled/push deploy will pick up the commit."

      - name: Upload UI screenshots artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screens-${{ inputs.tier || 'core' }}
          path: |
            public/screenshots/ui/
            /tmp/flight3d-ui-screens-*/
          if-no-files-found: ignore
