name: Ghost host release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    if: startsWith(github.event.release.tag_name, 'ghost-host-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Require tag to match the standalone package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const {version}=JSON.parse(readFileSync("host/package.json")); if(process.env.RELEASE_TAG!==`ghost-host-v${version}`) throw new Error("Release tag must match host/package.json");'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:ghost
      - run: npm run test:ghost-package
        env:
          CHROME_NO_SANDBOX: '1'
      - name: Attach verified standalone archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/ghost-host/*.tgz artifacts/ghost-host/SHA256SUMS
