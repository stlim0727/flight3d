name: Generate Departure Audio

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Specific stage to regenerate (leave blank for all outdated stages)'
        required: false
        default: ''
      force:
        description: 'Force regenerate even if script has not changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate-departure-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Synthesize departure audio clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_FREE_KEY || secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Configure GEMINI_API_KEY in repository secrets to synthesize departure radio audio."
            exit 1
          fi
          ARGS=()
          if [ -n "${{ github.event.inputs.stage }}" ]; then
            ARGS+=("--stage=${{ github.event.inputs.stage }}")
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS+=("--force")
          fi
          npm run audio:departure -- "${ARGS[@]}"

      - name: Verify departure audio contract
        run: |
          npm run audio:check
          node --test tests/departureRadio.test.js

      - name: Commit and push updated audio clips
        run: |
          if [ -n "$(git status --porcelain public/audio/departure)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/audio/departure
            git commit -m "chore(audio): regenerate departure radio audio clips [skip ci]"
            git push
          else
            echo "Departure audio files are already up-to-date."
          fi

      - name: Upload audio artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: departure-audio
          path: public/audio/departure/
