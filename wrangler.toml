# Cloudflare Workers config for static web preview builds (Workers Static Assets).
# Matches Keepory's Cloudflare Workers Builds integration: preview_urls enables
# branch and commit preview URLs for non-production branches and PRs on
# stlim0727.workers.dev. Production hosting remains on GitHub Pages.
name = "flight3d"
compatibility_date = "2026-10-19"
workers_dev = true
preview_urls = true

[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
